# Optional services for later experiments. Nothing is started by the Python launcher.
services:
  pgvector:
    image: pgvector/pgvector:0.8.1-pg17
    profiles: [pgvector]
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: local-lab-only
      POSTGRES_DB: lab
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lab -d lab"]
      interval: 5s
      timeout: 3s
      retries: 10
  qdrant:
    image: qdrant/qdrant:v1.15.4
    profiles: [qdrant]
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
volumes:
  pgvector_data:
  qdrant_data:
