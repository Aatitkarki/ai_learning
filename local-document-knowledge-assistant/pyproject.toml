[project]
name = "local-document-knowledge-assistant"
version = "0.1.0"
description = "A local, inspectable RAG experimentation workbench. No automatic model downloads."
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "numpy==2.4.6",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "streamlit==1.64.0",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=6,<7"]
chroma = ["chromadb>=1.1,<2"]
faiss = ["faiss-cpu>=1.12,<2"]
pgvector = ["psycopg[binary]>=3.2,<4"]
langchain = ["langchain-text-splitters>=1,<2"]

[build-system]
requires = ["setuptools>=80,<83"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["knowledge_lab*", "evaluation*"]

[tool.setuptools.package-data]
evaluation = ["cases.json"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires an explicitly enabled external service or optional package"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
